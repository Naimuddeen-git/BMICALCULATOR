
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #ede9fe, #cffafe);
    background-size: 300% 300%;
    animation: bg 8s ease infinite;
}
@keyframes bg {
    50% { background-position: 100% 100%; }
}
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 35px 0;
}
.intro {
    animation: slide 1s ease;
}
.intro h1 {
    font-size: clamp(40px, 5vw, 65px);
    font-weight: 800;
    color: #172554;
}
.intro span { color: #6d5dfc; }
.intro p { color: #52627d; line-height: 1.8; }
.calculator {
    background: #ffffffc9;
    backdrop-filter: blur(15px);
    border: 1px solid white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 25px 60px #3730a322;
    animation: slide 1s ease .2s both;
    transition: .3s;
}
.calculator:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 70px #3730a333;
}
.form-control {
    padding: 12px;
    border-radius: 12px;
}
.btn-calc {
    background: linear-gradient(90deg, #4f46e5, #9333ea);
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 13px;
    transition: .3s;
}
.btn-calc:hover {
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px #6d5dfc55;
}
#result { overflow-wrap: anywhere; }
.result-anim { animation: pop .4s ease; }
@keyframes slide {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes pop {
    from { opacity: 0; transform: scale(.8); }
    to { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>
<section class="hero">
<div class="container">
<div class="row align-items-center g-5">
    <div class="col-lg-6 intro">
        <span class="badge rounded-pill bg-white text-primary p-3 mb-3">
             YOUR HEALTH COMPANION
        </span>
        <h1>Know Your Body.<br><span>Know Your BMI.</span></h1>
        <p class="fs-5 mt-3">
            A simple way to understand your body mass index.
            Enter your details and explore your BMI category.
        </p>
    </div>


    <div class="col-lg-5 offset-lg-1">
        <div class="calculator">
            <div class="text-center mb-4">
                
                <h2 class="fw-bold">BMI Calculator</h2>
                <p class="text-secondary">Let's check your BMI</p>
            </div>

            <label for="weight" class="form-label fw-bold">Weight (kg)</label>
            <input type="number" id="weight" class="form-control mb-4"
                   placeholder="Enter weight" min="0.1" step="any">

            <label for="height" class="form-label fw-bold">Height (cm)</label>
            <input type="number" id="height" class="form-control mb-4"
                   placeholder="Enter height" min="1" step="any">

            <button onclick="calculateBMI()" class="btn btn-calc w-100">
                Calculate BMI →
            </button>

            <div id="result" class="text-center mt-4" aria-live="polite"></div>

            <hr>
            <p class="text-center text-secondary small mb-0">
                Eat well • Stay active • Feel better
            </p>
        </div>
    </div>

</div>
</div>
</section>
<script src="script.js"></script>
</body>
</html>
